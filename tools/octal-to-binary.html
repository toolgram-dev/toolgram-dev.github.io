<body><div class="nav-container"></div><div class="page"><button class="back-btn" onclick="window.location.href='../tools.html'"><i class="fas fa-arrow-left"></i> Back to Tools</button>
<div class="tool-container"><div class="tool-header"><div class="tool-header-icon"><i class="fas fa-microchip"></i></div><div><h1>Octal to Binary Converter</h1><p>Convert octal numbers to binary instantly</p></div></div>
<div class="tool-interface"><div class="tool-column"><div class="tool-column-title"><i class="fas fa-pencil-alt"></i> Enter Octal</div><div style="padding:20px"><input type="text" id="octalInput" class="tool-textarea" style="height:60px" placeholder="e.g., 52" value="52"></div><div class="tool-actions"><button class="action-btn" onclick="convertOctalToBinary()"><i class="fas fa-sync-alt"></i> Convert to Binary</button><button class="secondary-btn" onclick="clearOctalBinary()"><i class="fas fa-trash"></i> Clear</button></div></div>

<script>function convertOctalToBinary(){let o=document.getElementById('octalInput').value.trim();let b=document.getElementById('binaryOutput');if(!/^[0-7]+$/.test(o)){b.innerHTML='<span style="color:#EF4444">Invalid octal (0-7 only)</span>';return}let r='';for(let i=0;i<o.length;i++){let d=parseInt(o[i],8);let bin=d.toString(2).padStart(3,'0');r+=bin}b.textContent=r}function clearOctalBinary(){document.getElementById('octalInput').value='';document.getElementById('binaryOutput').textContent=''}function copyBinary(){let t=document.getElementById('binaryOutput').textContent;if(t){navigator.clipboard.writeText(t);let b=document.querySelector('.copy-btn');b.innerHTML='<i class="fas fa-check"></i> Copied!';setTimeout(()=>b.innerHTML='<i class="far fa-copy"></i> Copy',2000)}}function loadRelated(){const t=[{n:"Binary to Octal",i:"fa-microchip",u:"binary-to-octal.html"},{n:"Binary to Hex",i:"fa-microchip",u:"binary-to-hex.html"},{n:"Hex to Decimal",i:"fa-hashtag",u:"hex-to-decimal-converter.html"},{n:"Binary to Decimal",i:"fa-calculator",u:"bin-dec.html"},{n:"Decimal to BCD",i:"fa-microchip",u:"decimal-to-bcd-converter.html"},{n:"BCD to Decimal",i:"fa-microchip",u:"bcd-to-decimal-converter.html"}];let h='';t.forEach(x=>{h+=`<a href="${x.u}" class="related-card"><div class="related-icon"><i class="fas ${x.i}"></i></div><span class="related-title">${x.n}</span></a>`});document.getElementById('relatedGrid').innerHTML=h}window.addEventListener('load',loadRelated);</script></body></html>
