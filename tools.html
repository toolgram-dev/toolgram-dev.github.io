<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Developer Tools | ToolGram</title><meta name="description" content="Browse all ToolGram developer tools: JSON formatter, Base64 encoder, UUID generator, SHA256 hasher, URL encoder, text converter, and more. Free online tools."><meta name="keywords" content="developer tools, online tools, JSON formatter, Base64 encoder, UUID generator, SHA256 hasher, free tools"><meta name="author" content="ToolGram"><meta name="robots" content="index, follow"><link rel="canonical" href="https://toolgram.com/tools.html"><meta property="og:title" content="All Developer Tools | ToolGram"><meta property="og:description" content="Browse complete collection of free developer tools"><meta property="og:url" content="https://toolgram.com/tools.html"><meta property="og:type" content="website"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/tool.css"><link rel="icon" href="https://i.postimg.cc/hGGkKC2W/Gemini-Generated-Image-2hkd0u2hkd0u2hkd.png" sizes="64x64"><style>.groups-container{width:calc(100% - 2rem);margin:0 1rem 20px 1rem;background:rgba(255,255,255,0.03);border-radius:16px;overflow-x:auto;overflow-y:visible}.groups-container::-webkit-scrollbar{height:10px}.groups-container::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:10px;margin:0 20px}.groups-container::-webkit-scrollbar-thumb{background:radial-gradient(circle,#8B5CF6,#EC4899);border-radius:10px}.main-groups-row{display:flex;flex-wrap:nowrap;gap:12px;padding:14px 20px;min-width:min-content;border-bottom:1px solid rgba(255,255,255,0.1)}.subgroups-row{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px;background:rgba(0,0,0,0.2)}.group-btn{padding:10px 24px;border-radius:40px;font-weight:700;font-size:1rem;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.1)}.group-btn:hover{background:rgba(255,255,255,0.15);color:#fff}.subgroup-btn{padding:8px 18px;border-radius:40px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.15)}.subgroup-btn:hover{background:rgba(255,255,255,0.2)}.group-btn.active,.subgroup-btn.active{background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;border-color:transparent;box-shadow:0 0 15px rgba(139,92,246,0.4)}.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin:40px 0}.tool-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;transition:all .3s ease;text-decoration:none;display:flex;flex-direction:column;align-items:flex-start;text-align:left}.tool-card:hover{transform:translateY(-8px);border-color:#8B5CF6;box-shadow:0 15px 35px rgba(139,92,246,0.3)}.tool-icon{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 0 20px 0;font-size:2rem}.tool-title{font-size:1.3rem;margin-bottom:10px;color:#fff;font-weight:700}.tool-description{color:rgba(255,255,255,0.6);font-size:.95rem;line-height:1.5;margin-bottom:20px}.tool-button{background:transparent;border:2px solid #8B5CF6;color:#8B5CF6;padding:10px 24px;border-radius:40px;margin-top:10px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .3s ease}.tool-button:hover{background:linear-gradient(135deg,#8B5CF6,#EC4899);border-color:transparent;color:#fff}.no-tools{text-align:center;padding:60px;color:rgba(255,255,255,0.5)}.ad-space-tool{height:30px;width:100%;margin:40px 0 20px}@media(max-width:1024px){.tools-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.group-btn{padding:8px 16px;font-size:.85rem}.subgroup-btn{padding:6px 12px;font-size:.75rem}.main-groups-row{gap:8px;padding:10px 15px}.tools-grid{grid-template-columns:1fr;gap:20px}.tool-card{padding:20px}.tool-icon{width:55px;height:55px;font-size:1.5rem}.tool-title{font-size:1.1rem}}</style></head><body><div class="nav-container"></div><div class="tools-page"><button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</button><h1 style="text-align:center;font-size:3.5rem;margin-bottom:20px;background:linear-gradient(135deg,var(--lb),var(--p),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Calculate what matters most.</h1><p style="text-align:center;color:rgba(255,255,255,0.8);margin-bottom:40px;font-size:1.2rem;">A universe of infinite tools behind your click.</p><div class="groups-container"><div class="main-groups-row" id="mainGroupsRow"></div><div id="subgroupsRow" class="subgroups-row" style="display:none"></div></div><div class="tools-grid" id="tools-grid"></div><div class="ad-space-tool"></div><footer class="footer-bg" style="margin-top:80px;"><div class="watermark">TOOLGRAM</div><div class="footer-content"><div class="footer-links"><div><h3 style="color:var(--lt);margin-bottom:20px;">Company</h3><a href="about.html">About Us</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a><a href="contact.html">Contact Us</a></div></div><div class="copyright"><p>© ToolGram. All rights reserved 2026.</p></div></div></footer></div><script src="js/nav-manager.js"></script><script src="js/main.js"></script><script>
const mainGroups=[{id:"all",name:"All Tools",hasSubgroups:false},{id:"finance",name:"Finance",hasSubgroups:true},{id:"developer",name:"Developer",hasSubgroups:true},{id:"design",name:"Design",hasSubgroups:true},{id:"health",name:"Health",hasSubgroups:true},{id:"travel",name:"Travel",hasSubgroups:true},{id:"shopping",name:"Shopping",hasSubgroups:false},{id:"automotive",name:"Automotive",hasSubgroups:false},{id:"gaming",name:"Gaming",hasSubgroups:false},{id:"pet",name:"Pet Care",hasSubgroups:false},{id:"parenting",name:"Parenting",hasSubgroups:false},{id:"food",name:"Food",hasSubgroups:false},{id:"security",name:"Security",hasSubgroups:true},{id:"misc",name:"Misc",hasSubgroups:false}];
const subgroupsMap={finance:["Loans & Mortgage","Saving & Investment","Taxes","Insurance","Retirement & Pensions","Budgeting & Personal Finance","Credit & Debt","Real Estate","Currency & Exchange","Financial Planning","Miscellaneous Finance"],developer:["JSON Tools","Encoding/Decoding","Hashing & Security","Formatting & Minification","Generators (UUID, Password)","Converters (CSV, XML, YAML)","API Tools (JWT)","Text Processing","Code Editors","Regex Tools"],design:["Color Tools","Gradient Generators","Image Converters","SVG Tools","Font Tools","UI/UX Tools"],health:["BMI Calculator","Calorie Counter","Workout Planner","Health Trackers","Water Intake"],travel:["Distance Calculator","Currency Converter","Timezone Converter","Flight Tools","Map Tools"],security:["Password Security","Encryption","Hash Generators","Privacy Checkers"]};
let currentGroup="all",currentSubgroup=null,allTools=[];
function renderGroups(){const mainContainer=document.getElementById("mainGroupsRow"),subgroupsContainer=document.getElementById("subgroupsRow");if(!mainContainer)return;let mainHtml="";for(const group of mainGroups){const activeClass=currentGroup===group.id?"active":"";mainHtml+=`<button class="group-btn ${activeClass}" data-group="${group.id}">${group.name}</button>`;}mainContainer.innerHTML=mainHtml;if(currentGroup!=="all"&&subgroupsMap[currentGroup]){let subHtml="";for(const sub of subgroupsMap[currentGroup]){const activeSubClass=currentSubgroup===sub?"active":"";subHtml+=`<button class="subgroup-btn ${activeSubClass}" data-subgroup="${sub}">${sub}</button>`;}subgroupsContainer.innerHTML=subHtml;subgroupsContainer.style.display="flex";document.querySelectorAll(".subgroup-btn").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".subgroup-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentSubgroup=btn.dataset.subgroup;renderTools();});});}else{subgroupsContainer.style.display="none";subgroupsContainer.innerHTML="";}document.querySelectorAll(".group-btn").forEach(btn=>{btn.addEventListener("click",()=>{const groupId=btn.dataset.group;if(currentGroup===groupId){currentSubgroup=null;renderGroups();renderTools();}else{currentGroup=groupId;currentSubgroup=null;renderGroups();renderTools();}});});}
function renderTools(){const grid=document.getElementById("tools-grid");if(!grid||!allTools.length)return;let filtered=allTools;if(currentGroup!=="all")filtered=filtered.filter(t=>t.group===currentGroup);if(currentSubgroup)filtered=filtered.filter(t=>t.subgroup===currentSubgroup);if(filtered.length===0){grid.innerHTML='<div class="no-tools">No tools found. Try another group!</div>';return;}grid.innerHTML=filtered.map(t=>`<a href="tools/${t.file}" class="tool-card"><div class="tool-icon" style="background:${t.color}"><i class="fas ${t.icon}"></i></div><h3 class="tool-title">${t.title}</h3><p class="tool-description">${t.desc}</p><button class="tool-button">Use Tool <i class="fas fa-arrow-right"></i></button></a>`).join("");}
fetch('tools-data.json').then(r=>r.json()).then(d=>{allTools=d.tools;renderGroups();renderTools();}).catch(e=>{console.error('Error loading tools:',e);document.getElementById('tools-grid').innerHTML='<div class="no-tools">Error loading tools. Please check tools-data.json file.</div>';});
</script></body></html>
