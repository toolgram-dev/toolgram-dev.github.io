<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>All Developer Tools | ToolGram</title><meta name="description" content="Browse all ToolGram developer tools: JSON formatter, Base64 encoder, UUID generator, SHA256 hasher, URL encoder, text converter, and more. Free online tools."><meta name="keywords" content="developer tools, online tools, JSON formatter, Base64 encoder, UUID generator, SHA256 hasher, free tools"><meta name="author" content="ToolGram"><meta name="robots" content="index, follow"><link rel="canonical" href="https://toolgram.tech/tools.html"><meta property="og:title" content="All Developer Tools | ToolGram"><meta property="og:description" content="Browse complete collection of free developer tools"><meta property="og:url" content="https://toolgram.tech/tools.html"><meta property="og:type" content="website"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/tool.css"><link rel="icon" href="/favicon.ico" sizes="64x64"><style>
.groups-container{width:calc(100% - 2rem);margin:0 1rem 20px 1rem;background:rgba(255,255,255,0.03);border-radius:16px;overflow-x:auto;overflow-y:visible}
.groups-container::-webkit-scrollbar{height:10px}
.groups-container::-webkit-scrollbar-track{background: transparent;border-radius:10px;margin:0 20px}
.groups-container::-webkit-scrollbar-thumb{background:radial-gradient(circle,#8B5CF6,#06B6D4);border-radius:10px}
.main-groups-row{display:flex;flex-wrap:nowrap;gap:12px;padding:14px 20px;min-width:min-content;border-bottom:1px solid rgba(255,255,255,0.1)}
.subgroups-row{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px;background:transparent;overflow-y:visible}
.group-btn{padding:10px 24px;border-radius:40px;font-weight:700;font-size:1rem;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.1);transition:all 0.2s ease}
.group-btn:hover{background:rgba(255,255,255,0.15);color:#fff}
.subgroup-btn{padding:8px 18px;border-radius:40px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.15);transition:all 0.2s ease}
.subgroup-btn:hover{background:rgba(255,255,255,0.2)}
.group-btn.active,.subgroup-btn.active{background:linear-gradient(135deg,#8B5CF6,#EC4899);color:#fff;border-color:transparent;box-shadow:0 0 15px rgba(139,92,246,0.4)}
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin:40px 0}
.tool-card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;transition:all .3s ease;text-decoration:none;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.tool-card:hover{transform:translateY(-8px);border-color:#8B5CF6;box-shadow:0 15px 35px rgba(139,92,246,0.3)}
.tool-icon{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 0 20px 0;font-size:2rem}
.tool-title{font-size:1.3rem;margin-bottom:10px;color:#fff;font-weight:700}
.tool-description{color:rgba(255,255,255,0.6);font-size:.95rem;line-height:1.5;margin-bottom:20px}
.tool-button{background:transparent;border:2px solid #8B5CF6;color:#8B5CF6;padding:10px 24px;border-radius:40px;margin-top:10px;cursor:pointer;font-weight:600;font-size:.9rem;transition:all .3s ease}
.tool-button:hover{background:linear-gradient(135deg,#8B5CF6,#EC4899);border-color:transparent;color:#fff}
.no-tools{text-align:center;padding:60px;color:rgba(255,255,255,0.5)}
.coming-soon-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);border-radius:16px;padding:25px;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;min-height:280px}
.coming-soon-icon{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 0 20px 0;font-size:2rem;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.4)}
.coming-soon-title{font-size:1.3rem;margin-bottom:10px;color:rgba(255,255,255,0.5);font-weight:700}
.coming-soon-desc{color:rgba(255,255,255,0.4);font-size:.95rem;line-height:1.5;margin-bottom:20px}
.coming-soon-button{background:transparent;border:2px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.4);padding:10px 24px;border-radius:40px;margin-top:10px;cursor:default;font-weight:600;font-size:.9rem}
.ad-space-tool{height:30px;width:100%;margin:40px 0 20px}
@media(max-width:1024px){.tools-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){
.tools-page{padding:0 12px}
.groups-container{width:100%;margin:0 0 20px 0}
.main-groups-row{gap:8px;padding:10px 12px}
.subgroups-row{flex-wrap:wrap;gap:8px;padding:10px 12px;overflow-x:visible}
.tools-grid{grid-template-columns:1fr;gap:20px;margin:40px 0}
.tool-card{padding:20px}
.tool-icon{width:55px;height:55px;font-size:1.5rem}
.tool-title{font-size:1.1rem}
.group-btn{padding:8px 14px;font-size:.85rem}
.subgroup-btn{padding:6px 10px;font-size:.75rem}
.coming-soon-card{padding:20px;min-height:240px}
.back-btn{margin-left:12px}
}
</style></head><body><div class="nav-container"></div><div class="tools-page"><button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</button><h1 style="text-align:center;font-size:clamp(3rem, 8vw, 4.9rem);margin-bottom:20px;background:linear-gradient(135deg,var(--lb),var(--p),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Calculate what matters most :)</h1><p style="text-align:center;color:rgba(255,255,255,0.8);margin-bottom:40px;font-size:1.8rem;">A universe of infinite tools behind your click.</p><div class="groups-container"><div class="main-groups-row" id="mainGroupsRow"></div><div id="subgroupsRow" class="subgroups-row" style="display:none"></div></div><div class="tools-grid" id="tools-grid"></div><div class="ad-space-tool"></div><footer class="footer-bg" style="margin-top:80px;"><div class="watermark">TOOLGRAM</div><div class="footer-content"><div class="footer-links"><div><h3 style="color:var(--lt);margin-bottom:20px;">Company</h3><a href="about.html">About Us</a><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a><a href="contact.html">Contact Us</a></div></div><div class="copyright"><p>© ToolGram. All rights reserved 2026.</p></div></div></footer></div><script src="js/nav-manager.js"></script><script src="js/main.js"></script><script>
const mainGroups=[
{id:"all",name:"All Tools",hasSubgroups:false},
{id:"finance",name:"Finance",hasSubgroups:true},
{id:"developer",name:"Developer",hasSubgroups:true},
{id:"design",name:"Design",hasSubgroups:true},
{id:"health",name:"Health",hasSubgroups:true},
{id:"travel",name:"Travel",hasSubgroups:true},
{id:"shopping",name:"Shopping",hasSubgroups:false},
{id:"automotive",name:"Automotive",hasSubgroups:false},
{id:"gaming",name:"Gaming",hasSubgroups:false},
{id:"food",name:"Food",hasSubgroups:false},
{id:"security",name:"Security",hasSubgroups:true},
{id:"others",name:"Others",hasSubgroups:true}
];
let currentGroup="all",currentSubgroup=null,allTools=[];
let availableSubgroups={};
function buildSubgroupsFromTools(){
let subs={};
allTools.forEach(tool=>{
if(!subs[tool.group])subs[tool.group]=new Set();
let subgroupName=tool.subgroup;
if(subgroupName==="Misc")subgroupName="MISCELLANEOUS";
if(subgroupName)subs[tool.group].add(subgroupName);
});
if(subs["others"]){
if(!subs["others"].has("Pet Care"))subs["others"].add("Pet Care");
if(!subs["others"].has("Parenting"))subs["others"].add("Parenting");
}
for(let group in subs){
subs[group]=Array.from(subs[group]).sort();
}
return subs;
}
function renderGroups(){
const mainContainer=document.getElementById("mainGroupsRow"),subgroupsContainer=document.getElementById("subgroupsRow");
if(!mainContainer)return;
let mainHtml="";
for(const group of mainGroups){
const activeClass=currentGroup===group.id?"active":"";
mainHtml+=`<button class="group-btn ${activeClass}" data-group="${group.id}">${group.name}</button>`;
}
mainContainer.innerHTML=mainHtml;
if(currentGroup!=="all"&&availableSubgroups[currentGroup]&&availableSubgroups[currentGroup].length>0){
let subHtml="";
for(const sub of availableSubgroups[currentGroup]){
const activeSubClass=currentSubgroup===sub?"active":"";
subHtml+=`<button class="subgroup-btn ${activeSubClass}" data-subgroup="${sub}">${sub}</button>`;
}
subgroupsContainer.innerHTML=subHtml;
subgroupsContainer.style.display="flex";
document.querySelectorAll(".subgroup-btn").forEach(btn=>{
btn.addEventListener("click",(e)=>{
e.stopPropagation();
document.querySelectorAll(".subgroup-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
currentSubgroup=btn.dataset.subgroup;
renderTools();
});
});
}else{
subgroupsContainer.style.display="none";
subgroupsContainer.innerHTML="";
}
document.querySelectorAll(".group-btn").forEach(btn=>{
btn.addEventListener("click",(e)=>{
e.stopPropagation();
const groupId=btn.dataset.group;
if(currentGroup===groupId&&currentSubgroup!==null){
currentSubgroup=null;
renderGroups();
renderTools();
}else{
currentGroup=groupId;
currentSubgroup=null;
renderGroups();
renderTools();
}
});
});
}
function renderTools(){
const grid=document.getElementById("tools-grid");
if(!grid||!allTools.length)return;
let filtered=allTools;
let hasRealTools=false;
if(currentGroup!=="all"){
filtered=allTools.filter(t=>t.group===currentGroup);
hasRealTools=filtered.length>0;
if(currentSubgroup){
let filterSubgroup=currentSubgroup;
if(filterSubgroup==="MISCELLANEOUS")filterSubgroup="Misc";
filtered=filtered.filter(t=>t.subgroup===filterSubgroup);
hasRealTools=filtered.length>0;
}
}else{
hasRealTools=filtered.length>0;
}
if(!hasRealTools){
let comingSoonCount=6;
let comingSoonCards='';
for(let i=0;i<comingSoonCount;i++){
comingSoonCards+=`<div class="coming-soon-card"><div class="coming-soon-icon"><i class="fas fa-clock"></i></div><h3 class="coming-soon-title">Coming Soon</h3><p class="coming-soon-desc">New tools are being added regularly</p><button class="coming-soon-button"><i class="fas fa-hourglass-half"></i> Stay Tuned</button></div>`;
}
grid.innerHTML=comingSoonCards;
return;
}
if(filtered.length===0){
let comingSoonCount=6;
let comingSoonCards='';
for(let i=0;i<comingSoonCount;i++){
comingSoonCards+=`<div class="coming-soon-card"><div class="coming-soon-icon"><i class="fas fa-clock"></i></div><h3 class="coming-soon-title">Coming Soon</h3><p class="coming-soon-desc">New tools are being added regularly</p><button class="coming-soon-button"><i class="fas fa-hourglass-half"></i> Stay Tuned</button></div>`;
}
grid.innerHTML=comingSoonCards;
return;
}
grid.innerHTML=filtered.map(t=>`<a href="tools/${t.file}" class="tool-card"><div class="tool-icon" style="background:${t.color}"><i class="fas ${t.icon}"></i></div><h3 class="tool-title">${t.title}</h3><p class="tool-description">${t.desc}</p><button class="tool-button">Use Tool <i class="fas fa-arrow-right"></i></button></a>`).join('');
}
fetch('tools-data.json').then(r=>r.json()).then(d=>{
if(d.tools){
allTools=d.tools;
}else if(Array.isArray(d)){
allTools=d;
}else{
allTools=[];
console.error('Unexpected JSON format');
}
availableSubgroups=buildSubgroupsFromTools();
renderGroups();
renderTools();
}).catch(e=>{
console.error('Error loading tools:',e);
let comingSoonCount=6;
let comingSoonCards='';
for(let i=0;i<comingSoonCount;i++){
comingSoonCards+=`<div class="coming-soon-card"><div class="coming-soon-icon"><i class="fas fa-clock"></i></div><h3 class="coming-soon-title">Coming Soon</h3><p class="coming-soon-desc">New tools are being added regularly</p><button class="coming-soon-button"><i class="fas fa-hourglass-half"></i> Stay Tuned</button></div>`;
}
document.getElementById('tools-grid').innerHTML=comingSoonCards;
});
</script></body></html>
